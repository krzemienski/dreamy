  "required_semantics": "'required' means dreamy CANNOT produce a correct artifact without the skill -- not that the skill is important. The three constraint skills were marked required while also carrying installable=false and source=null, which no clean machine can ever satisfy: `pip install dreamy` followed by `dreamy skills verify` failed by construction. Measured rather than assumed -- compiling a remediation artifact with ZERO of them present yields a complete 1,917-byte artifact that still names each one, because R6f degrades a missing skill to a bounded warning. They are therefore ENHANCING, not required. A skill may be marked required only when it is also obtainable (installable=true with a resolvable source)."

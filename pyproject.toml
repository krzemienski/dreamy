[build-system]
# BOOT-001: pinned exactly, not floored. A range here is resolved at build time
# by PEP 517 isolation, so two machines could build the same source with
# different backends and emit different wheel bytes — defeating G12.
# Must stay byte-consistent with packaging/build-requirements.in; enforced by
# tools/verify-locks.sh.
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "dreamy"
version = "2.0.0.dev0"
description = "Read-only cross-harness coding-session reconciler"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Nick Krzemienski" }]
keywords = ["agents", "observability", "reconciliation", "read-only"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

# SPEC-001 / PKG-003: the deterministic core (ingest, correlate, git evidence,
# compile, report, redact, safety) runs on the standard library alone. Every
# dependency below is optional, so a minimal install cannot silently acquire an
# unvetted transitive surface, and the product stays operational when the agent
# layer is unavailable.
dependencies = []

# BOOT-001 lock strategy: every extra is pinned to an exact version. Ranges are
# prohibited here because a pristine machine resolving a range would install a
# version that was never conformance-tested, which defeats G12 reproducibility.
# NOTE: exact top-level pins do NOT lock the transitive graph. Fully-resolved,
# hash-verified lock files are generated by tools/lock-deps.sh into
# config/requirements-<extra>.lock. Until every extra has a committed lock file,
# dependency locking is INCOMPLETE and G12 is not satisfiable.
[project.optional-dependencies]
# SDK-001: pinned to the version actually inventoried and conformance-tested.
# See docs/research/SDK-VERSION-LOCK.md.
agent = ["claude-agent-sdk==0.2.128"]
# dreamy.tui.* is the only subtree importing textual. This extra is NOT
# installed in the current environment, so G11 is recorded blocked rather than
# claimed. The pin is the version G11 must be validated against once installed.
tui = ["textual==8.2.8"]
dev = [
  "pytest==9.1.1",
  "ruff==0.15.7",
  "mypy==1.19.1",
  "build==1.5.0",
]

[project.scripts]
dreamy = "dreamy.cli:main"

[project.urls]
Homepage = "https://github.com/krzemienski/dreamy"
Source = "https://github.com/krzemienski/dreamy"
Issues = "https://github.com/krzemienski/dreamy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dreamy"]

[tool.hatch.build.targets.sdist]
include = ["src/dreamy", "tests", "docs", "config", "packaging", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "sdk: requires the Claude Agent SDK and a reachable CLI",
  "tui: requires textual",
  "acceptance: real-system acceptance gate, no mocks",
  "slow: builds or installs artifacts; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/dreamy"]
ignore_missing_imports = true
